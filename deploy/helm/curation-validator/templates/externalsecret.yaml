{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "cv.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.existingSecret }}
  data:
    - secretKey: {{ .Values.secrets.keys.clientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.secrets.keys.clientSecret }}
    - secretKey: {{ .Values.secrets.keys.sessionSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.secrets.keys.sessionSecret }}
{{- end }}
