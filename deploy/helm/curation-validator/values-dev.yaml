image:
  repository: docker-registry.ebrains.eu/ebrains-data-curation/curation-validator-dev/image-curation-validator-dev
  tag: c48f7c1461b3ca74ca8908fe920052adeb8f452c

config:
  # TODO: fill in once IT confirms the host name
  oidcClientId: ""
  oidcRedirectUri: "https://curation-validator-dev.apps.dev-jsccloud.ebrains.eu/auth/callback"
  frontendOrigin: "https://curation-validator-dev.apps.dev-jsccloud.ebrains.eu"

ingress:
  host: curation-validator-dev.apps.dev-jsccloud.ebrains.eu

# Secrets come from Vault through External Secrets Operator (see deploy/README.md).
# GROUP = curation-validation-dev (Vault mount kv-curation-validation-dev), NS = curation-validation-dev.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: SecretStore
    name: secretstore-curation-validation-dev-curation-validation-dev   # TODO confirm with Ops: secretstore-<GROUP>-<NS>
  remoteKey: curation-validation-dev/curation-validator                  # Vault path <NS>/<secret name>