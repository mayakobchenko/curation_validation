# Argo CD Application for the DEV environment.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: curation-validator-dev
  namespace: argocd                     
spec:
  project: curation-validation-dev                       
  source:
    repoURL: https://github.com/mayakobchenko/curation_validation.git   
    targetRevision: main
    path: deploy/helm/curation-validator
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: curation-validation-dev   
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
