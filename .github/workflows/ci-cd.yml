name: Build, push image and update GitOps values (curation-validator)

# GitOps flow: CI only builds the image and writes the new tag into deploy/helm/.../values-*.yaml.
# Argo CD (running in the cluster) sees that commit and rolls out the new version. CI no longer needs
# a kubeconfig or any access to the cluster.

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - 'deploy/**'          # the tag-bump commit below only touches deploy/**, so it cannot retrigger CI

permissions:
  contents: write            # needed to commit the new image tag

env:
  SHORT_TAG: ${{ github.sha }}
  REGISTRY: docker-registry.ebrains.eu

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.ref == 'refs/heads/production' && 'docker-registry.ebrains.eu/ebrains-data-curation/curation-validator' || 'docker-registry.ebrains.eu/ebrains-data-curation/curation-validator-dev/image-curation-validator-dev' }}
      VALUES_FILE: ${{ github.ref == 'refs/heads/production' && 'values-prod.yaml' || 'values-dev.yaml' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_TAG }}
            ${{ env.IMAGE }}:latest

      - name: Write the new image tag into the Helm values
        run: |
          set -euo pipefail
          f="deploy/helm/curation-validator/${VALUES_FILE}"
          sed -i -E "s|^(\s*tag:\s*).*$|\1${SHORT_TAG}|" "$f"
          grep -n "tag:" "$f"

      - name: Commit the tag bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/curation-validator/${VALUES_FILE}
          git commit -m "deploy: ${VALUES_FILE%.yaml} image ${SHORT_TAG::7}" || { echo "nothing to commit"; exit 0; }
          git push
